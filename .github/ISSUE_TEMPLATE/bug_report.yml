name: Bug report
description: Something in Nazo isn't working correctly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: I tapped ... and the app ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings -> About shows the version and version code.
      placeholder: "9.0 (code 9)"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7, Android 14"
    validations:
      required: false
