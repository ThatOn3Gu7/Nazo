name: Feature request
description: Suggest an idea or improvement for Nazo.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature and what it would let you do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this help?
      description: What problem does it solve, or what would it make better?
    validations:
      required: false
