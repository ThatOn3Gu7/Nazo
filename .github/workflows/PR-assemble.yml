
name: PR Assemble (compile check)

# Compile check for Arena branches and the default branch.
# Both debug and release APKs are assembled and uploaded as artifacts.
on:
  push:
    branches:
      - 'arena/**'
      - 'master'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------
  # Decide whether the push is worth compiling.
  #
  # Both conditions must be true to skip:
  #   1. The commit is tagged as docs/chore/style/ci or has a skip marker.
  #   2. No compilable files or workflow files changed.
  #
  # Manual dispatch always builds.
  # ---------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      reason: ${{ steps.decide.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUBJECT="$(git log -1 --pretty=%s)"
          echo "Head commit subject: $SUBJECT"

          TAG_SAYS_DOCS=false

          if printf '%s' "$SUBJECT" | grep -qiE '^(docs|chore|style|ci)(\([^)]*\))?!?:'; then
            TAG_SAYS_DOCS=true
          fi

          if printf '%s' "$SUBJECT" | grep -qiE '\[(skip ci|ci skip)\]'; then
            TAG_SAYS_DOCS=true
          fi

          BEFORE="${{ github.event.before }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --pretty=format: --name-only HEAD)"
          else
            CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          CODE_CHANGED=false

          if printf '%s\n' "$CHANGED" | grep -qE '\.(kt|kts|java|xml|pro|gradle|properties|json|png|jpg|jpeg|webp|svg|ttf|otf|ogg|mp3|wav)$'; then
            CODE_CHANGED=true
          fi

          # Gradle wrapper and build configuration files.
          if printf '%s\n' "$CHANGED" | grep -qE '(^|/)(gradlew|gradlew\.bat|gradle/wrapper/.*|settings\.gradle.*|build\.gradle.*)$'; then
            CODE_CHANGED=true
          fi

          # Workflow changes must also be validated, including this file.
          if printf '%s\n' "$CHANGED" | grep -qE '^\.github/workflows/'; then
            CODE_CHANGED=true
          fi

          if [ "$TAG_SAYS_DOCS" = true ] && [ "$CODE_CHANGED" = false ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs-only commit with no compilable or workflow changes" >> "$GITHUB_OUTPUT"
          elif [ "$TAG_SAYS_DOCS" = true ] && [ "$CODE_CHANGED" = true ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-code commit tag but compilable or workflow files changed - building anyway" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=code or configuration change" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          BUILD_DECISION: ${{ steps.decide.outputs.should_build }}
          BUILD_REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "### Build gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build:** \`$BUILD_DECISION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** $BUILD_REASON" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Tests and both APK builds.
  # ---------------------------------------------------------------------
  compile:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # JVM unit tests run before APK assembly.
      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      # Preserve the existing debug build and its normal debug signing.
      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nazo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Build the optimized release variant.
      # When the repository signing secrets exist, use the same signing
      # configuration as the normal release workflow. Otherwise, assemble
      # an unsigned release APK so the release variant is still compiled.
      - name: Assemble release APK
        id: release
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            KEYSTORE="$RUNNER_TEMP/nazo-release-signing.jks"

            if ! printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"; then
              echo "::error::Could not decode the release signing keystore."
              exit 1
            fi

            trap 'rm -f "$KEYSTORE"' EXIT

            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$KEYSTORE" \
              -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
              2>&1 | tee -a gradle-build.log

            BUILD_STATUS=${PIPESTATUS[0]}
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit "$BUILD_STATUS"
          else
            echo "::warning::Release signing secrets are not configured. The release APK will be unsigned."

            ./gradlew assembleRelease --stacktrace 2>&1 | tee -a gradle-build.log

            BUILD_STATUS=${PIPESTATUS[0]}
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit "$BUILD_STATUS"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nazo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        env:
          RELEASE_SIGNED: ${{ steps.release.outputs.signed }}
        run: |
          echo "### Compile check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug APK: \`nazo-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release APK: \`nazo-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_SIGNED" = "true" ]; then
            echo "The release APK was signed using the configured app keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ The release APK is unsigned because signing secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Report failures in the job summary and, for Arena branches,
      # as a comment on the branch's open PR.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ERRORS=$(
            {
              grep -E '^e: ' gradle-build.log | head -60
              grep -A 12 'What went wrong' gradle-build.log | head -30
              grep -E 'FAILED$|FAILURE:' gradle-build.log | head -20
            } 2>/dev/null | head -100
          )

          if [ -z "$ERRORS" ]; then
            ERRORS="$(tail -80 gradle-build.log 2>/dev/null || echo 'No build log was produced.')"
          fi

          {
            echo "### :x: Debug/release compile check failed"
            echo ""
            echo '```'
            echo "$ERRORS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Only Arena branches have the automatic PR feedback loop.
          if [[ "$BRANCH_NAME" != arena/* ]]; then
            echo "Not an Arena branch; failure details are available in the job summary."
            exit 0
          fi

          PR_NUMBER=$(gh pr list --repo "$REPOSITORY" \
            --head "$BRANCH_NAME" --state open \
            --json number --jq '.[0].number' 2>/dev/null)

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for $BRANCH_NAME; summary only."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "### :x: Debug/release compile check failed (auto-report)

          \`\`\`
          $ERRORS
          \`\`\`

          Full log: $RUN_URL" || true
