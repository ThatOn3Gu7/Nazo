name: Build & Release

# Runs when a version tag like v2.0 is pushed. The tag IS the release
# version — bump versionName in app/build.gradle.kts before tagging.
#
# The trigger is tag-based, NOT branch-based, so a tag pointing at any commit
# releases — including a commit on an unmerged working branch. That is
# deliberate: it lets a release ship without merging and closing an active
# Arena session.
#
# Because of that, releasing is restricted to an explicit allowlist (see the
# `authorize` job). Anyone else pushing a `v*` tag gets a failed run and no
# release. Update RELEASE_ACTORS to change who may release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Who is allowed to cut a release. Newline-free, comma-separated.
  # - ThatOn3Gu7 ............... repository owner
  # - arena-ai-coding-agent[bot] the Arena agent, acting on the owner's behalf
  RELEASE_ACTORS: 'ThatOn3Gu7,arena-ai-coding-agent[bot]'

jobs:
  # ---------------------------------------------------------------------
  # Gate: only the allowlisted actors may cut a release.
  #
  # A tag push from anyone else fails here and the build/release job never
  # runs, so no APK is published and no GitHub Release is created. Deleting
  # their tag afterwards is enough to clean up.
  # ---------------------------------------------------------------------
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag pusher is allowed to release
        env:
          ACTOR: ${{ github.triggering_actor || github.actor }}
        run: |
          echo "Tag:   ${{ github.ref_name }}"
          echo "Actor: $ACTOR"
          allowed=0
          # Split on commas and compare exactly - a substring match would let
          # a crafted username slip through.
          IFS=',' read -ra NAMES <<< "$RELEASE_ACTORS"
          for name in "${NAMES[@]}"; do
            if [ "$ACTOR" = "$name" ]; then allowed=1; break; fi
          done
          if [ "$allowed" -ne 1 ]; then
            echo "::error::$ACTOR is not permitted to publish a release. Allowed: $RELEASE_ACTORS"
            exit 1
          fi
          echo "$ACTOR is authorized to release."

  build-and-release:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # If this step fails (compose/kotlin/build error), the job stops here
      # and NO release is created for this tag.
      - name: Build (compile + assemble)
        id: build
        env:
          STORE_PWD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > keystore.jks
            ./gradlew assembleRelease assembleDebug \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PWD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PWD"
            rm -f keystore.jks
          else
            ./gradlew assembleRelease assembleDebug
          fi

      - name: Stage APKs with descriptive names
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//'); fi
          mkdir -p apks
          cp app/build/outputs/apk/release/*.apk "apks/Nazo-release-$VERSION.apk"
          cp app/build/outputs/apk/debug/*.apk "apks/Nazo-debug-$VERSION.apk"

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV" ]; then RANGE=""; else RANGE="$PREV..HEAD"; fi
          python3 .github/scripts/gen_release_notes.py "$RANGE" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nazo ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            apks/*.apk
          draft: false
          prerelease: false
